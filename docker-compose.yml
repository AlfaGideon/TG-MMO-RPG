version: "3.9"

# Бот и админка должны жить в ОДНОМ процессе launch.py. Прежняя конфигурация
# поднимала bot.main и admin.main отдельно; после сохранения того же токена в
# панели admin.main запускал второй polling и оба экземпляра конфликтовали за
# getUpdates. Заодно два процесса одновременно писали в один SQLite-файл.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.admin
    command: ["python", "launch.py"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
