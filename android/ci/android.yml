# ВНИМАНИЕ: это шаблон workflow. Он лежит здесь, потому что агент Arena
# не может создавать файлы в .github/workflows/ через API.
# Одноразовая активация описана в android/ci/README.md:
# скопируйте этот файл в .github/workflows/android.yml через веб-интерфейс GitHub.
name: Android APK

on:
  # Автосборка и публикация APK при создании релиза на GitHub
  release:
    types: [published]
  # Ручной запуск: Actions → Android APK → Run workflow
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег существующего релиза, к которому прикрепить APK (необязательно)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.release_tag }}"
          fi
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0-dev.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Собираю версию $VERSION (versionCode ${{ github.run_number }})"

      - name: Build release APK
        working-directory: android
        run: >
          ./gradlew assembleRelease --no-daemon --stacktrace
          -PappVersion=${{ steps.ver.outputs.version }}
          -PappVersionCode=${{ steps.ver.outputs.versionCode }}

      - name: Align and sign APK
        run: |
          set -eo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}  ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls -la "$SDK/build-tools/" || true
          BT="$SDK/build-tools/34.0.0"
          test -x "$BT/zipalign" || { echo "zipalign не найден в $BT"; exit 2; }
          test -x "$BT/apksigner" || { echo "apksigner не найден в $BT"; exit 2; }

          echo "--- собранные APK:"
          find android/app/build/outputs -name "*.apk" -ls || true
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$APK" || { echo "APK не найден в outputs"; exit 2; }

          mkdir -p build
          "$BT/zipalign" -p -f 4 "$APK" build/shadow-lands-aligned.apk

          echo "--- ключ подписи:"
          ls -la android/keystore/
          head -1 android/keystore/release.key.pem android/keystore/release.cert.pem
          "$BT/apksigner" sign \
            --min-sdk-version 24 \
            --key android/keystore/release.key.pem \
            --cert android/keystore/release.cert.pem \
            --out build/shadow-lands.apk build/shadow-lands-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs build/shadow-lands.apk
          ls -la build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-lands-apk
          path: build/shadow-lands.apk
          retention-days: 30

      - name: Attach APK to GitHub release
        if: steps.ver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.ver.outputs.tag }}" build/shadow-lands.apk --clobber

      # APK также кладётся файлом прямо в репозиторий (android/dist/shadow-lands.apk),
      # чтобы его можно было скачать из дерева проекта без захода в Releases.
      - name: Commit APK into repository
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          mkdir -p android/dist
          cp build/shadow-lands.apk android/dist/shadow-lands.apk
          git add -f android/dist/shadow-lands.apk
          git commit -m "Build shadow-lands.apk for ${{ github.event.release.tag_name }}"
          git push origin main
