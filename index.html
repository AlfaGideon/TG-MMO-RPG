<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌑 Shadow Lands — Admin</title>
<link rel="stylesheet" href="webapp/static/admin.css?v=4">
<style>
#boot{max-width:780px;margin:2rem auto;padding:1.2rem;background:#1a1a24;
      border:1px solid #2e2e3e;border-radius:12px}
#boot h2{color:#8b5cf6;margin:0 0 .6rem}
#boot p{color:#94a3b8;font-size:.9rem;line-height:1.6;margin:.4rem 0}
#boot pre{background:#0a0a0f;border:1px solid #2e2e3e;border-radius:8px;padding:.7rem;
    overflow:auto;font-size:.75rem;white-space:pre-wrap;color:#f87171}
#boot code{background:#12121a;padding:.1rem .35rem;border-radius:4px}
</style>
</head>
<body>
<div class="layout" id="layout">
  <div class="sidebar-overlay" onclick="sidebar(false)"></div>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">🌑</span>
      <div>
        <div class="brand-title">Shadow Lands</div>
        <div class="brand-sub">Admin panel</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="nav"></nav>
    <div class="sidebar-footer">
      <div id="botPill"><span class="dot" id="botDot"></span><span id="botText">Загрузка…</span></div>
      <div class="build">вход: <span id="whoami">…</span></div>
      <div class="build">сборка <span id="buildStamp">…</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" onclick="sidebar()">☰</button>
      <div class="page-title" id="pageTitle">Панель управления</div>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Переключить тему">🌙</button>
      <button class="btn" onclick="openSearch()" title="Поиск (Ctrl/Cmd+K)">🔍 Поиск</button>
    </header>
    <div class="breadcrumbs" id="breadcrumbs"></div>
    <div class="container" id="view">
      <div id="boot">
        <h2>⏳ Запуск Python-среды</h2>
        <p id="msg">Загружаю Pyodide…</p>
        <p style="font-size:.8rem">Первый запуск качает Python (~10 МБ) — 10–30 секунд.
           Дальше страница поднимается из кеша браузера.</p>
      </div>
    </div>
  </div>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="search-overlay" id="searchOverlay" onclick="closeSearch(event)">
  <div class="search-box-ui" onclick="event.stopPropagation()">
    <input type="text" id="searchInput" placeholder="Поиск игроков..." autocomplete="off">
    <div class="search-results-ui" id="searchResults"><div class="search-empty">Начни вводить имя игрока...</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// Загрузчик админки. Забирает Python-модули из этого же репозитория.
// __init__.py НЕ грузятся: GitHub Pages (Jekyll) вырезает файлы,
// чьи имена начинаются с подчёркивания. Пакеты создаём сами.
//
// Список модулей живёт в modules.json, а не здесь. Так новый модуль
// подхватывается, даже если сам index.html отдан из старого кеша.
// FALLBACK — аварийная копия на случай, если modules.json недоступен.
const FALLBACK = {
  packages: ["engine","webapp","webapp/pages","webapp/actions"],
  modules: [
    "engine/content.py","engine/data.py","engine/models.py","engine/world.py",
    "engine/cataclysm_kinds.py","engine/cataclysm.py","engine/horde.py",
    "engine/behavior.py","engine/rules.py","engine/death.py","engine/party.py",
    "engine/hero.py","engine/items.py","engine/respawn.py","engine/quests.py",
    "engine/social.py","engine/explore.py","engine/permissions.py","engine/texts.py",
    "engine/mapview.py","engine/audit.py","engine/adminops.py","engine/adminworld.py",
    "engine/adminmenu.py","engine/adminbot.py","engine/adminroute.py","engine/itemui.py",
    "engine/stash.py","engine/landmarks.py","engine/worldboss.py","engine/craft.py",
    "engine/auction.py","engine/trade.py","engine/combat.py","engine/inventory.py",
    "engine/shop.py","engine/game.py","engine/storage.py","webapp/html.py",
    "webapp/backend.py","webapp/dom.py","webapp/session.py","webapp/transport.py",
    "webapp/telegram.py","webapp/pages/dashboard.py","webapp/charts.py",
    "webapp/pages/bot.py","webapp/pages/players.py","webapp/pages/dungeons.py",
    "webapp/pages/world_forms.py","webapp/pages/world_map.py","webapp/pages/world_grid.py",
    "webapp/pages/world_cataclysms.py","webapp/pages/world_living.py","webapp/pages/world.py",
    "webapp/pages/content.py","webapp/pages/economy.py","webapp/pages/audit.py",
    "webapp/pages/settings.py","webapp/actions/audit_actions.py","webapp/actions/bot_actions.py",
    "webapp/actions/content_actions.py","webapp/actions/cataclysm_actions.py",
    "webapp/actions/devops_actions.py","webapp/actions/economy_actions.py",
    "webapp/actions/player_actions.py","webapp/actions/settings_actions.py",
    "webapp/actions/living_actions.py","webapp/actions/world_actions.py",
    "webapp/app.py","webapp/boot.py",
  ],
};

const RUNTIMES = [
  "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/",
  "https://cdn.jsdelivr.net/npm/pyodide@0.26.4/full/",
  "https://unpkg.com/pyodide@0.26.4/full/",
  "https://fastly.jsdelivr.net/pyodide/v0.26.4/full/",
];

function sidebar(force) {
  const l = document.getElementById("layout");
  l.classList.toggle("sidebar-open", typeof force === "boolean" ? force : undefined);
}

(function initTheme() {
  const saved = localStorage.getItem("admin-theme") || "dark";
  document.documentElement.setAttribute("data-theme", saved);
  const btn = document.getElementById("themeToggle");
  if (btn) btn.textContent = saved === "light" ? "☀️" : "🌙";
})();

function toggleTheme() {
  const html = document.documentElement;
  const btn = document.getElementById("themeToggle");
  const current = html.getAttribute("data-theme") || "dark";
  const next = current === "light" ? "dark" : "light";
  html.setAttribute("data-theme", next);
  localStorage.setItem("admin-theme", next);
  if (btn) btn.textContent = next === "light" ? "☀️" : "🌙";
}

function updatePlayersMassCount() {
  const label = document.getElementById("playersMassCount");
  if (!label) return;
  label.textContent = "Выбрано: " + document.querySelectorAll(".player-check:checked").length;
}

function openSearch() { document.getElementById("searchOverlay").classList.add("open"); document.getElementById("searchInput").focus(); }
function closeSearch(e) { if (!e || e.target === document.getElementById("searchOverlay")) document.getElementById("searchOverlay").classList.remove("open"); }

(function searchWire(){
  const input = document.getElementById("searchInput");
  const box = document.getElementById("searchResults");
  if (!input) return;
  input.addEventListener("input", function(){
    const q = input.value.trim().toLowerCase();
    if (!q) { box.innerHTML = '<div class="search-empty">Начни вводить имя игрока...</div>'; return; }
    if (!window.__app) { box.innerHTML = '<div class="search-empty">Админка ещё загружается...</div>'; return; }
    const out = [];
    for (const p of Object.values(window.__app.store.players || {})) {
      if (String(p.tg_id).includes(q) || (p.name && p.name.toLowerCase().includes(q))) {
        out.push(`<div class="search-row" onclick="window.__app.go('players'); window.__app.modal(window.__app.pages.players.edit_form(window.__app, '${p.tg_id}'));">` +
          `<span>${p.name} <small>(TG ${p.tg_id})</small></span><small>игрок</small></div>`);
      }
    }
    for (let i = 0; i < (window.__app.store.items || []).length; i++) {
      const it = window.__app.store.items[i];
      if (it && it.name && it.name.toLowerCase().includes(q)) {
        out.push(`<div class="search-row" onclick="window.__app.go('economy'); window.__app.state.eco_tab='instances';">` +
          `<span>${it.icon || ''} ${it.name}</span><small>предмет</small></div>`);
      }
    }
    box.innerHTML = out.length ? '<div class="search-cat">Результаты</div>' + out.join('') : '<div class="search-empty">Ничего не найдено</div>';
  });
  document.addEventListener("keydown", function(e){
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openSearch(); }
    if (e.key === "Escape") closeSearch();
  });
})();

const say = (t) => { const n = document.getElementById("msg"); if (n) n.textContent = t; };

function fail(title, err, hint) {
  document.getElementById("view").innerHTML =
    '<div id="boot"><h2>❌ ' + title + '</h2><pre>' + String(err) + '</pre><p>' + hint + '</p></div>';
}

function loadScript(base) {
  return new Promise((ok, no) => {
    const s = document.createElement("script");
    s.src = base + "pyodide.js";
    s.onload = ok;
    s.onerror = () => no(new Error("нет ответа: " + base));
    document.head.appendChild(s);
  });
}

async function bootRuntime() {
  for (const base of RUNTIMES) {
    try {
      say("Загружаю Python-среду… (" + new URL(base).hostname + ")");
      await loadScript(base);
      return await loadPyodide({ indexURL: base });
    } catch (e) { console.warn("зеркало недоступно:", base, e); }
  }
  throw new Error("ни одно зеркало Python-среды не ответило");
}

(async () => {
  let py;
  try {
    py = await bootRuntime();
  } catch (err) {
    return fail("Не удалось загрузить Python", err,
      "Нужен интернет — среда грузится с CDN. Проверь соединение и обнови страницу.");
  }

  const stamp = Date.now();
  try {
    const ROOT = "/app";
    py.FS.mkdirTree(ROOT);

    // Манифест грузим первым и мимо кеша. Если он недоступен — берём
    // аварийную копию, вшитую в страницу.
    let manifest = FALLBACK;
    try {
      say("Читаю список модулей…");
      const r = await fetch("modules.json?v=" + stamp, { cache: "reload" });
      if (r.ok) {
        const parsed = await r.json();
        if (Array.isArray(parsed.modules) && parsed.modules.length) manifest = parsed;
      }
    } catch (e) { console.warn("modules.json недоступен, беру запасной список", e); }

    const MODULES = manifest.modules;
    const PACKAGES = manifest.packages || FALLBACK.packages;

    // Пакеты и их __init__.py создаём локально, из сети не тянем.
    for (const pkg of PACKAGES) {
      py.FS.mkdirTree(ROOT + "/" + pkg);
      py.FS.writeFile(ROOT + "/" + pkg + "/__init__.py", "");
    }

    // Модули тянем параллельно и мимо кеша: иначе браузер/CDN отдаёт старую сборку.
    let done = 0;
    const sources = await Promise.all(MODULES.map(async (path) => {
      const r = await fetch(path + "?v=" + stamp, { cache: "reload" });
      if (!r.ok) throw new Error(path + " → HTTP " + r.status);
      const src = await r.text();
      if (src.trimStart().startsWith("<")) {
        throw new Error(path + " → вместо кода пришёл HTML (файла нет в репозитории)");
      }
      say("Загружаю модули… " + (++done) + "/" + MODULES.length);
      return src;
    }));
    // Каталоги под вложенные модули создаём заранее — иначе writeFile упадёт.
    MODULES.forEach((path) => {
      const dir = path.slice(0, path.lastIndexOf("/"));
      if (dir) py.FS.mkdirTree(ROOT + "/" + dir);
    });
    MODULES.forEach((path, i) => py.FS.writeFile(ROOT + "/" + path, sources[i]));
    window.__modules = MODULES;

    py.runPython(
      "import sys, builtins\n" +
      "sys.path.insert(0, '/app')\n" +
      "builtins.CODE_ORIGIN = 'github'\n" +
      "builtins.GH_REPO = 'AlfaGideon/TG-MMO-RPG'\n");
    say("Запускаю админку…");
    await py.runPythonAsync("import webapp.boot");
    window.__py = py;
    const stampNode = document.getElementById("buildStamp");
    if (stampNode) stampNode.textContent = new Date(stamp).toLocaleTimeString();
  } catch (err) {
    console.error(err);
    const local = location.protocol === "file:";
    // ImportError вида "cannot import name 'X' from 'webapp'" почти всегда
    // означает не отсутствие файла в репозитории, а устаревший список модулей:
    // страница отдана из кеша и про новый модуль просто не знает.
    const text = String(err);
    const miss = text.match(/cannot import name '([\w.]+)' from '([\w.]+)'/);
    let hint;
    if (miss) {
      const path = miss[2].replace(/\./g, "/") + "/" + miss[1] + ".py";
      const known = (window.__modules || []).includes(path);
      hint = known
        ? "Модуль <code>" + path + "</code> загружен, но импорт всё равно упал — " +
          "скорее всего он идёт в <code>modules.json</code> позже зависимого файла. " +
          "Проверь порядок: зависимость должна быть выше."
        : "Страница загрузила старый список модулей: <code>" + path + "</code> в нём нет. " +
          "Это кеш, а не репозиторий. Обнови страницу с <code>Ctrl+F5</code> " +
          "(на телефоне — очисти данные сайта). Если не помогло — добавь " +
          "<code>" + path + "</code> в <code>modules.json</code>.";
    } else if (local) {
      hint = "Файл открыт с диска (<code>file://</code>). Модули лежат рядом и грузятся по HTTP — " +
        "включи GitHub Pages либо запусти <code>python3 -m http.server</code>.";
    } else {
      hint = "Проверь, что папки <code>engine/</code> и <code>webapp/</code> есть в ветке " +
        "<code>main</code> и что Pages опубликован из корня <code>/ (root)</code>.";
    }
    fail("Не удалось загрузить модули", err, hint);
  }
})();
</script>
</body>
</html>
