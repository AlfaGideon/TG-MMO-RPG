<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌑 Shadow Lands — Admin</title>
<link rel="stylesheet" href="webapp/static/admin.css">
</head>
<body>
<header>
  <h1>🌑 Shadow Lands — Admin</h1>
  <div id="botPill"><span class="dot" id="botDot"></span><span id="botText">Загрузка…</span></div>
</header>
<nav id="nav"></nav>
<div class="container" id="view">
  <div class="card" id="loader">
    <h2>⏳ Запуск Python-среды</h2>
    <p class="muted" id="loaderMsg">Загружаю Pyodide…</p>
  </div>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
// Единственная задача JS: поднять Python и отдать ему управление.
const MODULES = [
  "engine/__init__.py", "engine/data.py", "engine/models.py", "engine/world.py",
  "engine/rules.py", "engine/texts.py", "engine/combat.py", "engine/game.py",
  "engine/storage.py",
  "webapp/__init__.py", "webapp/backend.py", "webapp/html.py", "webapp/dom.py",
  "webapp/transport.py", "webapp/telegram.py",
  "webapp/pages/__init__.py", "webapp/pages/dashboard.py", "webapp/pages/bot.py",
  "webapp/pages/players.py", "webapp/pages/world.py", "webapp/pages/content.py",
  "webapp/pages/settings.py",
  "webapp/actions/__init__.py", "webapp/actions/bot_actions.py",
  "webapp/actions/player_actions.py", "webapp/actions/world_actions.py",
  "webapp/app.py", "webapp/boot.py",
];

const say = (t) => { const n = document.getElementById("loaderMsg"); if (n) n.textContent = t; };

(async () => {
  try {
    say("Загружаю Pyodide…");
    const py = await loadPyodide();
    say("Копирую Python-модули…");
    const FS = py.FS, ROOT = "/app";
    FS.mkdirTree(ROOT);
    for (const path of MODULES) {
      const full = ROOT + "/" + path;
      FS.mkdirTree(full.substring(0, full.lastIndexOf("/")));
      const res = await fetch(path + "?v=" + Date.now());
      if (!res.ok) throw new Error("не найден файл " + path + " (HTTP " + res.status + ")");
      FS.writeFile(full, await res.text());
    }
    py.runPython("import sys; sys.path.insert(0, '/app')");
    say("Запускаю админку…");
    await py.runPythonAsync("import webapp.boot");
    window.__py = py;
  } catch (err) {
    document.getElementById("view").innerHTML =
      '<div class="card"><h2>❌ Ошибка запуска</h2><pre class="log">' +
      String(err) + '</pre><p class="muted">Открой страницу через preview/HTTP-сервер, ' +
      'а не как file:// — модули загружаются по fetch.</p></div>';
  }
})();
</script>
</body>
</html>
