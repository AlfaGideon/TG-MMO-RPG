<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shadow Lands Admin{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>🌑 Shadow Lands — Admin</h1>
        <nav>
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a>
            <a href="/players" class="{% if request.path == '/players' %}active{% endif %}">Игроки</a>
            <a href="/items" class="{% if request.path == '/items' %}active{% endif %}">Предметы</a>
            <a href="/battles" class="{% if request.path == '/battles' %}active{% endif %}">Бои</a>
        </nav>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
