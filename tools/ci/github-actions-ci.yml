name: CI

# Раньше репозиторий не имел ни одного workflow: тесты запускались только
# вручную, и поломка обнаруживалась уже после пуша. Теперь каждый push и
# pull request прогоняет весь набор проверок обоих стеков.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # pytest/pytest-asyncio нужны 12 наборам в tests/, они не входят
        # в requirements.txt (это runtime-зависимости приложения).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run all test suites
        # run_all.py сам находит все tests/test_*.py и предупреждает,
        # если какая-то зависимость отсутствует (тогда часть сценариев
        # молча пропустилась бы — это не успех).
        run: python3 tests/run_all.py

      - name: Rebuild browser bundle and verify wiring
        # Бандл обязан соответствовать modules.json: если разработчик
        # забыл `python3 tools/build_bundle.py`, сборка изменит файл и
        # шаг ниже это покажет.
        run: |
          python3 tools/build_bundle.py
          python3 tests/test_wiring.py

      - name: Fail if bundle was not committed
        run: |
          if ! git diff --quiet -- webapp/bundle.json index.html; then
            echo "::error::webapp/bundle.json устарел — запусти python3 tools/build_bundle.py и закоммить результат"
            git diff --stat -- webapp/bundle.json index.html
            exit 1
          fi
